name: Озвучка Тобота

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Перегенерировать все реплики'
        type: boolean
        default: false
      styles:
        description: 'Эмоциональные стили (только если задан ключ Azure)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить edge-tts
        run: pip install edge-tts

      - name: Синтезировать озвучку (Azure, если заданы секреты, иначе бесплатный edge-tts)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FORCE: ${{ inputs.force }}
          STYLES: ${{ inputs.styles }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$STYLES" = "true" ]; then ARGS="$ARGS --styles"; fi
          python3 tools/generate_voices.py $ARGS

      - name: Сохранить озвучку в репозиторий
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Изменений в озвучке нет"
          else
            git commit -m "Озвучка: обновлены реплики"
            git push
          fi

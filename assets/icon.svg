<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="50%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#5fb4ff"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe9f7"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a7a"/>
      <stop offset="100%" stop-color="#16325c"/>
    </linearGradient>
  </defs>

  <!-- фон: мягкое небо -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="110" cy="110" r="60" fill="#ffffff" opacity="0.35"/>
  <circle cx="420" cy="90" r="34" fill="#ffffff" opacity="0.25"/>

  <!-- антенна -->
  <line x1="256" y1="118" x2="256" y2="72" stroke="#16325c" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="60" r="26" fill="#ff7a1a"/>

  <!-- голова -->
  <rect x="122" y="118" width="268" height="232" rx="72" fill="url(#body)" stroke="#16325c" stroke-width="14"/>

  <!-- визор -->
  <rect x="158" y="170" width="196" height="124" rx="46" fill="url(#visor)"/>

  <!-- глаза -->
  <circle cx="212" cy="232" r="24" fill="#ffffff"/>
  <circle cx="300" cy="232" r="24" fill="#ffffff"/>
  <circle cx="218" cy="238" r="11" fill="#16325c"/>
  <circle cx="306" cy="238" r="11" fill="#16325c"/>

  <!-- улыбка -->
  <path d="M212 268 Q256 306 300 268" fill="none" stroke="#ff7a1a" stroke-width="12" stroke-linecap="round"/>

  <!-- щёчки -->
  <circle cx="176" cy="318" r="9" fill="#ff7a1a" opacity="0.6"/>
  <circle cx="336" cy="318" r="9" fill="#ff7a1a" opacity="0.6"/>

  <!-- ушки -->
  <rect x="100" y="216" width="30" height="70" rx="14" fill="#2a7bff" stroke="#16325c" stroke-width="10"/>
  <rect x="382" y="216" width="30" height="70" rx="14" fill="#2a7bff" stroke="#16325c" stroke-width="10"/>

  <!-- шея и плечи -->
  <rect x="208" y="350" width="96" height="30" rx="12" fill="#2a7bff" stroke="#16325c" stroke-width="10"/>
  <path d="M136 470 Q136 384 256 384 Q376 384 376 470 Z" fill="#2a7bff" stroke="#16325c" stroke-width="14" stroke-linejoin="round"/>
  <circle cx="256" cy="430" r="14" fill="#ff7a1a"/>
</svg>

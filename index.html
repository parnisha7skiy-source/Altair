<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТОБОТ: МИССИИ АЛЬТАИРА</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#5fb4ff">
<style>
  :root { --ink:#16325c; --card:rgba(255,255,255,.95); --accent:#ff7a1a; --blue:#2a7bff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  body { background:radial-gradient(120% 90% at 50% 0%, #bfe6ff 0%, #8fd0ff 45%, #5fb4ff 100%); }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
  .top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 12px) 14px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pill { background:var(--card); border-radius:999px; padding:8px 16px; font-weight:800; font-size:16px; box-shadow:0 2px 10px rgba(20,60,120,.2); white-space:nowrap; }
  .pill.btnlike { border:0; font:inherit; font-weight:900; cursor:pointer; min-width:64px; }
  .right { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .title { position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top) + 60px); text-align:center; font-size:clamp(28px,7vw,44px); font-weight:900; color:#fff; text-shadow:0 3px 0 #1d5fbf, 0 6px 16px rgba(20,60,120,.35); pointer-events:none; }
  .bubble { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 140px); transform:translateX(-50%) scale(.96); width:min(92vw,520px); background:var(--card); border-radius:22px; padding:12px 16px; font-size:clamp(16px,4.2vw,20px); font-weight:700; line-height:1.35; text-align:center; box-shadow:0 6px 20px rgba(20,60,120,.25); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  .bubble.show { opacity:1; transform:translateX(-50%) scale(1); }
  .hint { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 196px); text-align:center; font-size:15px; font-weight:800; color:var(--ink); pointer-events:none; transition:opacity .4s; text-shadow:0 1px 0 #fff; }
  .bottom { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(env(safe-area-inset-bottom) + 14px); display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:560px; margin:0 auto; }
  .btn { font:inherit; font-weight:800; font-size:18px; border:0; border-radius:22px; padding:14px 10px; min-height:66px; background:var(--card); color:var(--ink); box-shadow:0 4px 0 rgba(20,60,120,.25); cursor:pointer; line-height:1.2; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(20,60,120,.25); }
  .btn.go { background:var(--accent); color:#fff; grid-column:1 / -1; font-size:22px; min-height:76px; box-shadow:0 4px 0 #c75300; }
  .btn:disabled { opacity:.6; cursor:default; transform:none; box-shadow:0 4px 0 rgba(20,60,120,.15); }
  .badge { display:block; font-size:12px; font-weight:700; opacity:.7; margin-top:2px; }
  .sheet { position:fixed; inset:0; background:rgba(10,30,70,.35); display:none; align-items:flex-end; justify-content:center; z-index:5; }
  .sheet.show { display:flex; }
  .card { background:#fff; width:100%; max-width:560px; border-radius:26px 26px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); max-height:82vh; overflow:auto; box-shadow:0 -6px 24px rgba(0,0,0,.25); }
  .card h2 { margin:0 0 12px; font-size:24px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .stat { background:#eef6ff; border-radius:18px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:28px; }
  .stat span { font-size:13px; font-weight:700; opacity:.75; }
  .ach { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; background:#f1f3f7; margin:6px 0; font-weight:700; color:#6b7890; }
  .ach.on { background:#e6f8ec; color:var(--ink); }
  .ach i { font-style:normal; font-size:22px; width:34px; text-align:center; }
  .close { width:100%; margin-top:12px; font:inherit; font-weight:800; font-size:17px; border:0; border-radius:18px; padding:14px; background:var(--blue); color:#fff; min-height:52px; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 280px); transform:translateX(-50%); background:var(--card); border-radius:18px; padding:10px 16px; font-weight:700; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.2); opacity:0; transition:opacity .3s; pointer-events:none; width:min(90vw,520px); text-align:center; z-index:6; }
  .toast.show { opacity:1; }
  .mission { position:fixed; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; max-height:60vh; background:#fff; border-radius:26px 26px 0 0; padding:12px 14px calc(env(safe-area-inset-bottom) + 14px); box-shadow:0 -6px 24px rgba(0,0,0,.25); display:none; flex-direction:column; gap:10px; z-index:4; }
  .mission.show { display:flex; }
  body.mission-on .bottom, body.mission-on .hint { display:none; }
  .mtop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .mtop .pill.btnlike { min-width:48px; padding:8px 12px; }
  .mprompt { font-size:clamp(22px,6vw,30px); font-weight:900; text-align:center; min-height:40px; }
  .mgrid { display:grid; gap:12px; padding:4px; overflow:auto; }
  .mopt { border:0; border-radius:26px; aspect-ratio:1 / 1; min-height:84px; box-shadow:0 5px 0 rgba(0,0,0,.2); cursor:pointer; transition:transform .15s; }
  .mopt:active { transform:translateY(3px); }
  .mopt.ok { outline:6px solid #43a047; outline-offset:2px; transform:scale(1.04); }
  .mopt.miss { animation:wob .4s; }
  @keyframes wob { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  .mresult { text-align:center; }
  .mresult h2 { margin:6px 0; font-size:24px; }
  .mresult p { font-size:20px; font-weight:800; margin:6px 0 12px; }
  .mresult .close { margin-top:0; }
  #err { display:none; position:fixed; left:6%; right:6%; top:30%; background:#fff; border-radius:16px; padding:16px; box-shadow:0 8px 30px rgba(0,0,0,.3); font-size:15px; z-index:9; }
  #err.show { display:block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <div class="pill" id="starsPill">⭐ 0</div>
  <div class="right">
    <button class="pill btnlike" id="langBtn">ҚАЗ</button>
    <div class="pill" id="missionsPill">🚀 0</div>
  </div>
</div>
<div class="title" data-k="title">Привет, Альтаир!</div>
<div class="bubble" id="bubble"></div>
<div class="hint" id="hint" data-k="hint">Нажми на Тобота — он поздоровается</div>

<div class="bottom">
  <button class="btn go" id="startBtn" data-k="start">Начать приключение</button>
  <button class="btn" id="colorsBtn"><span data-k="colors">Учить цвета</span></button>
  <button class="btn" id="playBtn" disabled><span data-k="play">Играть</span><span class="badge" data-k="soon">скоро</span></button>
  <button class="btn" id="rewardsBtn" style="grid-column:1 / -1" data-k="rewards">Мои награды</button>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <h2 data-k="rewardsTitle">Мои награды</h2>
    <div class="stats">
      <div class="stat"><b id="sStars">0</b><span data-k="stars">звёзд</span></div>
      <div class="stat"><b id="sMissions">0</b><span data-k="missions">миссий</span></div>
      <div class="stat"><b id="sColors">0/8</b><span data-k="colorsCount">цветов</span></div>
    </div>
    <div id="achList"></div>
    <button class="close" id="closeSheet" data-k="close">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { TobotCharacter } from './js/tobot-character.js';
import { UI, LANGS, initialLang, saveLang } from './js/i18n.js';
import { loadPhrases, pickLine, pickMixed, audioReady } from './js/tobot-lines.js';
import { runColorsMission } from './js/mission-colors.js';

const $ = (id) => document.getElementById(id);
const KEY = 'tobot.progress.v1';
// условия достижений по порядку из UI.achievements
const ACH_OK = [
  p => p.missions >= 1,
  p => p.colors.includes('red'),
  p => p.colors.length >= 8,
  p => p.helped >= 1,
  p => p.stars >= 30,
];

let lang = initialLang();
const t = (k) => UI[lang][k];

// ---------- язык интерфейса
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach((el) => {
    const v = UI[lang][el.dataset.k];
    if (typeof v === 'string') el.textContent = v;
  });
  $('langBtn').textContent = t('langBtn');
  renderProgress();
}

// ---------- прогресс (только на этом устройстве; ничего не отправляется)
function loadProgress() {
  const base = { stars: 0, missions: 0, colors: [], helped: 0 };
  try { const p = JSON.parse(localStorage.getItem(KEY)); if (p && typeof p === 'object') return { ...base, ...p }; } catch (e) {}
  return base;
}
let progress = loadProgress();
function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {}
}

function renderProgress() {
  $('starsPill').textContent = '⭐ ' + progress.stars;
  $('missionsPill').textContent = '🚀 ' + progress.missions + ' ' + t('missions');
  $('sStars').textContent = progress.stars;
  $('sMissions').textContent = progress.missions;
  $('sColors').textContent = progress.colors.length + '/8';
  $('achList').innerHTML = UI[lang].achievements.map((a, i) => {
    const on = ACH_OK[i](progress);
    return `<div class="ach ${on ? 'on' : ''}"><i>${on ? a.icon : '🔒'}</i>${a.name}</div>`;
  }).join('');
}

// ---------- всплывающие подсказки
let toastT = null;
function toast(text, ms = 2600) {
  const el = $('toast'); el.textContent = text; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
}
let bubbleT = null;
function showBubble(text) {
  const b = $('bubble'); b.textContent = text; b.classList.add('show');
  clearTimeout(bubbleT);
}
function hideBubbleLater() {
  clearTimeout(bubbleT);
  bubbleT = setTimeout(() => $('bubble').classList.remove('show'), 1800);
}

// ---------- рендер
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
let pr = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pr);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
camera.position.set(1.3, 1.25, 4.1);
camera.lookAt(0, 0.95, 0);
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6a8fc8, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2.5, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd0ff, 1.0); rim.position.set(-3, 2, -3); scene.add(rim);
{ // дешёвая «тень» под ногами вместо shadow map
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, 'rgba(10,40,90,.45)'); gr.addColorStop(1, 'rgba(10,40,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.003; scene.add(m);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < 0.75 ? 50 : 35;      // на узком экране отодвигаем, чтобы Тобот помещался целиком
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- Тобот
// модель лежит в models/; её можно заменить новым файлом с теми же именами клипов
const tobot = new TobotCharacter({ url: './models/tobot.glb' });
scene.add(tobot.root);

let hintShown = true;
function hideHint() { if (hintShown) { hintShown = false; $('hint').style.opacity = 0; } }

let phrasesReady = false;
let noVoiceShown = false;
function speakLine(line) {
  if (!line) return;
  hideHint();
  showBubble(line.text);
  if (line.lang === 'kk' && !line.audio && !tobot.voice.hasVoiceFor('kk') && !noVoiceShown) {
    noVoiceShown = true;
    toast(t('noVoice'), 4000);
  }
  tobot.say(line.type, line, { onend: hideBubbleLater });
}
function greet() { if (phrasesReady) speakLine(pickLine(lang, 'greeting')); }
function chat() { if (phrasesReady) speakLine(pickMixed(lang)); }

// тап по Тоботу: новая реплика; речь на iPhone разрешена только после жеста пользователя
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.intersectObject(tobot.root, true).length) chat();
});

// ---------- миссия «Учить цвета»
let activeMission = null;
function startColors() {
  if (!phrasesReady || activeMission) return;
  hideHint();
  document.body.classList.add('mission-on');
  activeMission = runColorsMission({
    host: document.body,
    strings: UI[lang],
    lang,
    missions: progress.missions,
    say: (type, text) => speakLine({ type, lang, text }),
    onCorrect: (c) => {
      progress.stars++;
      if (!progress.colors.includes(c)) progress.colors.push(c);
      saveProgress(); renderProgress();
    },
    onFinish: () => {
      progress.missions++;
      saveProgress(); renderProgress();
    },
    onClose: () => {
      activeMission = null;
      document.body.classList.remove('mission-on');
      tobot.stopSpeaking();
      hideBubbleLater();
    },
  });
}
$('colorsBtn').onclick = startColors;

// «Начать приключение» пока ведёт в единственную готовую миссию — «Учить цвета»
$('startBtn').onclick = () => startColors();
$('rewardsBtn').onclick = () => { renderProgress(); $('sheet').classList.add('show'); };
$('closeSheet').onclick = () => $('sheet').classList.remove('show');
$('sheet').onclick = (e) => { if (e.target.id === 'sheet') $('sheet').classList.remove('show'); };
$('langBtn').onclick = () => {
  lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
  if (activeMission) activeMission.close();
  saveLang(lang); noVoiceShown = false;
  applyLang();
  greet();
};

// ---------- старт
applyLang();
try {
  await loadPhrases();
  phrasesReady = true;
} catch (e) {
  console.error(e);
  $('err').innerHTML = '<b>Не удалось загрузить реплики</b><br>' + (e && e.message ? e.message : e);
  $('err').classList.add('show');
}
try {
  await tobot.load();
  tobot.play('Idle', { fade: 0 });
  camera.lookAt(0, 0.95, 0);
  const v = tobot.validate();
  if (v.missingClips.length) console.warn('Нет клипов:', v.missingClips);
} catch (e) {
  console.error(e);
  $('err').innerHTML = '<b>Не удалось загрузить Тобота</b><br>' + (e && e.message ? e.message : e);
  $('err').classList.add('show');
}

const clock = new THREE.Clock();
let frames = 0, acc = 0, lowSecs = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  tobot.update(dt);
  renderer.render(scene, camera);
  // адаптивное качество: при FPS < 40 два секунды подряд снижаем разрешение
  frames++; acc += dt;
  if (acc >= 1) {
    const fps = frames / acc; frames = 0; acc = 0;
    lowSecs = fps < 40 ? lowSecs + 1 : 0;
    if (lowSecs >= 2 && pr > 1) { pr = Math.max(1, pr - 0.25); renderer.setPixelRatio(pr); resize(); lowSecs = 0; }
  }
});
</script>
</body>
</html>
